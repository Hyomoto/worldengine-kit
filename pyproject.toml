[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "worldengine-planet-kit"
version = "0.1.0"
description = "Generate WorldEngine planets and assemble Vintage Story WorldEngine Planet mods"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.26.0",
  "protobuf>=6.33.1",
  "Pillow>=10.0.0",
  "PyPlatec==1.4.3",
  "pypng>=0.20220715.0",
  "noise==1.2.2",
]

[project.scripts]
planetkit = "planetkit.cli:main"

[tool.setuptools.packages.find]
include = ["planetkit*"]
